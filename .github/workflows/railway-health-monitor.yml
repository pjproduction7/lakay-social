name: Railway production health monitor

on:
  schedule:
    # every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check production /health
        id: check
        run: |
          set -euo pipefail
          URL="https://lakay-social-production-361d.up.railway.app/health"
          echo "Checking $URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          echo "status_code=$STATUS_CODE" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do when healthy
        if: steps.check.outputs.healthy == 'true'
        run: echo "Production healthy — exiting."

      - name: Create/update GitHub issue (notify)
        if: steps.check.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '🚨 Production API is down — automated monitor';
            const now = new Date().toISOString();
            const body = `Automated health check failed for https://lakay-social-production-361d.up.railway.app/health at ${now}.\n\nThis workflow attempted an automated redeploy (empty commit push) and created/updated this issue so you can follow up.`;

            // Look for an existing open issue with the same title
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Health check still failing at ${now}. An automated redeploy attempt was made.` });
              core.setOutput('issue_url', existing.html_url);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.setOutput('issue_url', created.data.html_url);
            }

      - name: Notify Slack (if configured)
        if: steps.check.outputs.healthy == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification.";
            exit 0;
          fi
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TEXT="🚨 Production health check FAILED for https://lakay-social-production-361d.up.railway.app/health\nTime: ${NOW}\nAction run: ${RUN_URL}\nAn automated redeploy was attempted."
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          echo "Posting Slack notification..."
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || echo "Slack notify failed"

      - name: Notify Microsoft Teams (if configured)
        if: steps.check.outputs.healthy == 'false'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set — skipping Teams notification.";
            exit 0;
          fi
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Simple message card supported by Incoming Webhook connector
          read -r PAYLOAD <<'JSON'
          {
            "text": "\u26A0\uFE0F Production health check FAILED for https://lakay-social-production-361d.up.railway.app/health\nTime: %s\nAction run: %s\nAn automated redeploy was attempted."
          }
          JSON
          PAYLOAD=$(printf "$PAYLOAD" "$NOW" "$RUN_URL")
          echo "Posting Teams notification..."
          curl -s -X POST -H 'Content-type: application/json' -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL" || echo "Teams notify failed"

      - name: Checkout repo (required for redeploy push)
        if: steps.check.outputs.healthy == 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Trigger redeploy by pushing an empty commit to main
        if: steps.check.outputs.healthy == 'false'
        env:
          TARGET_BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Creating empty commit to trigger redeploy on $TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git commit --allow-empty -m "ci: trigger redeploy (automated health monitor)"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild rollup

      - name: Optional: attempt Railway CLI redeploy (requires RAILWAY_API_KEY secret)
        if: steps.check.outputs.healthy == 'false'
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          if [ -z "${RAILWAY_API_KEY:-}" ]; then
            echo "RAILWAY_API_KEY not provided — skipping railway CLI redeploy.";
            exit 0;
          fi
          npm i -g @railway/cli@latest
          echo "Logging into Railway CLI"
          railway login --apiKey "$RAILWAY_API_KEY"
          echo "Attempting 'railway up' to trigger a redeploy (may require linked project)"
          railway up --yes || echo "railway up failed or requires manual intervention"

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/lcov-report
