name: Railway production health monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check production /health
        id: check
        run: |
          set -euo pipefail
          URL="https://lakay-social-production.up.railway.app/health"
          echo "Checking $URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          echo "status_code=$STATUS_CODE" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do when healthy
        if: steps.check.outputs.healthy == 'true'
        run: echo "Production healthy - exiting."

      - name: Create or update GitHub issue
        if: steps.check.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Production API is down - automated monitor';
            const now = new Date().toISOString();
            const body = `Automated health check failed for https://lakay-social-production.up.railway.app/health at ${now}.`;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Health check still failing at ${now}.` });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Checkout repo
        if: steps.check.outputs.healthy == 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Trigger redeploy via empty commit
        if: steps.check.outputs.healthy == 'false'
        env:
          TARGET_BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "$TARGET_BRANCH"
          # Ensure branch is up-to-date (prefer fast-forward; rebase if needed)
          git fetch origin "$TARGET_BRANCH"
          git pull --rebase origin "$TARGET_BRANCH" || echo "rebase failed - continuing"
          git commit --allow-empty -m "ci: trigger redeploy (automated health monitor)"
          # Try push; if rejected, rebase against remote and retry with lease
          if ! git push origin HEAD:"$TARGET_BRANCH"; then
            echo "Push rejected; retrying with rebase + force-with-lease"
            git pull --rebase origin "$TARGET_BRANCH" || true
            git push --force-with-lease origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Optional Railway CLI redeploy
        if: steps.check.outputs.healthy == 'false'
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          if [ -z "${RAILWAY_API_KEY:-}" ]; then
            echo "RAILWAY_API_KEY not provided - skipping railway CLI redeploy."
            exit 0
          fi
          npm i -g @railway/cli@latest
          railway login --apiKey "$RAILWAY_API_KEY"
          railway up --yes || echo "railway up failed or requires manual intervention"
