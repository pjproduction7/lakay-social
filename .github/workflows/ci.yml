name: CI

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lakay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lakay_test
      VITE_API_BASE_URL: http://localhost:4000
      NODE_ENV: test
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Clean install
        run: rm -rf node_modules package-lock.json
      - name: Install dependencies
        run: |
          # Use reproducible `npm ci`; if optional native binaries fail to install
          # (Rollup optional native package bug on some runners), fall back to
          # installing without optional deps so CI can proceed.
          npm ci || npm i --no-optional
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for Postgres
        run: |
          n=0
          until pg_isready -h localhost -p 5432 -U postgres || [ $n -ge 30 ]; do
            echo "Waiting for Postgres... ($n)"
            n=$((n+1))
            sleep 1
          done
      - name: Setup database
        run: node setup-db.js
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Run lint
        continue-on-error: true
        run: npx eslint src --ext .js,.jsx,.ts,.tsx
      - name: Run tests (with coverage)
        run: npx vitest run --coverage --reporter dot
      - name: Upload coverage artifacts (HTML + lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage
            coverage/lcov.info
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
      - name: Skip Codecov upload (no token)
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "CODECOV_TOKEN not set; skipping Codecov upload"
      - name: Upload HTML coverage as artifact (for quick inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/lcov-report
      - name: Build
        run: npm run build --if-present
