version: '3.8'
services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    working_dir: /app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - lakay-net
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lakay-net

secrets:
  lakay_secret:
    file: ./lakay_secret.txt

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4001
      - db
      - redis
      - db
    command: sh -c "npm run migrate && npm start"
    networks:
    secrets:
      - lakay_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      - lakay-net

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lakaydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      - lakay-net

volumes:
  pgdata:

networks:
  lakay-net:
    driver: bridge
